spring.application.name=tracker

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:trackerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console to inspect tables via browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration
# Secret is read from the JWT_SECRET environment variable and must be a
# base64-encoded value of at least 32 bytes (openssl rand -base64 32).
# The fallback below is a throwaway development key; never use it in deployment.
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS0zMi1ieXRlcyE=}
app.jwt.expiration-ms=3600000
